<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>txview - Transaction Detail</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>txview</h1>
        <div class="status-indicator disconnected" id="status-dot"></div>
        <span id="status-text">disconnected</span>
    </header>
    <div class="detail-standalone" id="detail-standalone">
        <p style="margin-bottom: 12px;"><a class="back-link" href="/">&larr; Back to dashboard</a></p>
        <div id="detail-content"><p class="loading">Loading&hellip;</p></div>
    </div>
    <script>
    (function() {
        'use strict';

        var statusDot = document.getElementById('status-dot');
        var statusText = document.getElementById('status-text');
        var detailContent = document.getElementById('detail-content');

        // Extract tx hash from URL path: /tx/0x...
        var pathParts = location.pathname.split('/');
        var txHash = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2];
        if (!txHash || !txHash.startsWith('0x')) {
            detailContent.innerHTML = '<p>Invalid transaction hash in URL.</p>';
            return;
        }

        document.title = 'txview - ' + txHash.substring(0, 10) + '\u2026';

        var ws = null;
        var rpcId = 1;
        var pending = {};

        fetch('/config')
            .then(function(r) { return r.json(); })
            .then(function(cfg) { connect(cfg.rpcEndpoint); })
            .catch(function(err) {
                statusText.textContent = 'config error: ' + err;
                detailContent.innerHTML = '<p>Failed to load config: ' + escapeHtml(String(err)) + '</p>';
            });

        function connect(endpoint) {
            ws = new WebSocket(endpoint);

            ws.onopen = function() {
                statusDot.className = 'status-indicator connected';
                statusText.textContent = 'connected';
                fetchTx();
            };

            ws.onclose = function(ev) {
                statusDot.className = 'status-indicator disconnected';
                statusText.textContent = 'disconnected (code ' + ev.code + ')';
            };

            ws.onerror = function() { ws.close(); };

            ws.onmessage = function(msg) {
                var data;
                try { data = JSON.parse(msg.data); } catch(e) { return; }
                if (data.id !== undefined && pending[data.id]) {
                    var cb = pending[data.id];
                    delete pending[data.id];
                    cb(data.result, data.error);
                }
            };
        }

        function rpcCall(method, params, callback) {
            var id = rpcId++;
            if (callback) pending[id] = callback;
            ws.send(JSON.stringify({jsonrpc: '2.0', id: id, method: method, params: params}));
        }

        function fetchTx() {
            rpcCall('txtracker_getTx', [txHash], function(result, err) {
                if (err) {
                    detailContent.innerHTML = '<p>Error: ' + escapeHtml(JSON.stringify(err)) + '</p>';
                    return;
                }
                if (!result) {
                    detailContent.innerHTML = '<p>Transaction not found in tracker.</p>';
                    return;
                }
                renderDetail(result);
            });
        }

        function renderDetail(info) {
            var base = parseTS(info.FirstSeen);
            var fields = [
                ['Hash', txHash],
                ['Status', info.Status],
                ['Local', info.Local ? 'yes' : 'no'],
                ['Type', info.TxType],
                ['Size', info.TxSize + ' bytes'],
                ['From', info.From || '-'],
                ['Nonce', info.Nonce],
                ['Gas', info.Gas],
                ['Gas Fee Cap', info.GasFeeCap ? info.GasFeeCap + ' wei' : '-'],
                ['Gas Tip Cap', info.GasTipCap ? info.GasTipCap + ' wei' : '-'],
                ['Value', info.Value ? info.Value + ' wei' : '-'],
                ['To', info.To || '-'],
                ['First Seen', formatTS(info.FirstSeen, null)],
                ['Requested', formatTS(info.Requested, base)],
                ['Requested From', info.RequestedFrom || '-'],
                ['Received', formatTS(info.Received, base)],
                ['Pooled', formatTS(info.Pooled, base)],
                ['Included', formatTS(info.Included, base)],
                ['Finalized', formatTS(info.Finalized, base)],
                ['Dropped', formatTS(info.Dropped, base)],
                ['Deliverer', info.Deliverer || '-'],
                ['Announcers', (info.Announcers || []).join(', ') || '-'],
                ['Block #', info.BlockNum || '-'],
                ['Block Hash', info.BlockHash || '-'],
                ['Reject Error', info.RejectErr || '-'],
            ];

            var html = '';
            for (var i = 0; i < fields.length; i++) {
                html += '<div class="field"><label>' + escapeHtml(fields[i][0]) +
                        '</label><div class="value">' + escapeHtml(String(fields[i][1])) + '</div></div>';
            }
            detailContent.innerHTML = html;
        }

        function parseTS(s) {
            if (!s || s === '0001-01-01T00:00:00Z') return null;
            var d = new Date(s);
            return isNaN(d.getTime()) ? null : d;
        }

        function formatTS(s, base) {
            var d = parseTS(s);
            if (!d) return '-';
            var abs = d.toLocaleTimeString('en-GB', {hour12: false}) + '.' +
                      String(d.getMilliseconds()).padStart(3, '0');
            if (base) {
                abs += ' (+' + msDelta(d, base) + ')';
            }
            return abs;
        }

        function msDelta(ts, base) {
            var deltaMs = ts.getTime() - base.getTime();
            if (deltaMs < 0) deltaMs = 0;
            var deltaSec = deltaMs / 1000;
            if (deltaSec < 0.1) return '0s';
            if (deltaSec < 10) return deltaSec.toFixed(1) + 's';
            if (deltaSec < 60) return Math.floor(deltaSec) + 's';
            if (deltaSec < 3600) return Math.floor(deltaSec / 60) + 'm' + Math.floor(deltaSec % 60) + 's';
            return Math.floor(deltaSec / 3600) + 'h' + Math.floor((deltaSec % 3600) / 60) + 'm';
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    })();
    </script>
</body>
</html>
